# Configuration for https://doc.rust-lang.org/clippy/

# Clippy lint configuration
# Use `cargo clippy --all-targets --no-default-features --features annotate -- -D warnings` to check,
# as CI does (`openvino` cannot be combined with other accelerator features, so `--all-features` fails)

# Enforce documentation
# This encourages documenting public APIs
warn-on-all-wildcard-imports = true

# Complexity thresholds
cognitive-complexity-threshold = 30
type-complexity-threshold = 250

# Allow certain patterns that are idiomatic or needed
# Add exceptions here as needed with justification

# Enforce stricter lints for production code
# These help catch common mistakes and improve code quality
