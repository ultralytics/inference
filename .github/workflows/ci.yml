name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

env:
  CARGO_TERM_COLOR: always
  # CI builds don't need debuginfo; dropping it cuts crate compile+link
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Incremental compilation adds overhead and never hits on cold CI runners.
  CARGO_INCREMENTAL: "0"
  # Coverage needs nightly. Pinned to a known-good one to dodge latest-nightly rustc
  # ICEs; bump forward periodically.
  NIGHTLY: nightly-2026-07-13

jobs:
  # Cross-platform tests (default features only - no video/ffmpeg required)
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # macos-latest's default Xcode 16.4 toolchain dangles libclang_rt.osx.a
      # (ld: library 'clang_rt.osx' not found). Select a present, known-good
      # Xcode and export its version so the Rust cache key is scoped to it -
      # otherwise a cache built under one image's Xcode dangles on another.
      - name: Select Xcode (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vE 'beta|16\.4' | sort -V | tail -1)"
          xcodebuild -version
          echo "XCODE_VER=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Formatting is platform-independent; check it once instead of on every OS.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          key: xcode-${{ env.XCODE_VER }}

      - name: Ensure toolchain
        run: rustup show

      - name: Clippy (annotate feature)
        if: matrix.os != 'macos-latest'
        run: cargo clippy --all-targets --no-default-features --features annotate -- -D warnings

      - name: Tests (annotate feature)
        if: matrix.os != 'macos-latest'
        run: cargo test --no-default-features --features annotate

      - name: Clippy (annotate + cuda + tensorrt)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --no-default-features --features annotate,cuda,tensorrt -- -D warnings

      - name: Tests (annotate + cuda + tensorrt)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --no-default-features --features annotate,cuda,tensorrt

      # `openvino` tests would download the provider plugin, so lint only.
      - name: Clippy (annotate + openvino)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --no-default-features --features annotate,openvino -- -D warnings

      # CoreML is macOS-only — covers issue #148 (GatherElements warmup) and graph_input_cast_0 fix
      - name: Clippy (coreml + annotate)
        if: matrix.os == 'macos-latest'
        run: cargo clippy --all-targets --no-default-features --features "coreml,annotate" -- -D warnings

      - name: Tests (coreml + annotate)
        if: matrix.os == 'macos-latest'
        run: cargo test --no-default-features --features "coreml,annotate"

      - name: Integration tests (CoreML regression, including ignored)
        if: matrix.os == 'macos-latest'
        run: cargo test --no-default-features --features "coreml,annotate" --test integration_test test_coreml_model_loads_and_warms_up -- --ignored --exact

  # GPU tests on the self-hosted NVIDIA runner. Hosted runners have no GPU, so the CUDA
  # execution provider and the `cuda-preprocess` kernel are only built and run here.
  cuda:
    name: test / cuda
    # Forks have no GPU runner, and a pull request from one must not run on ours.
    if: github.repository == 'ultralytics/inference' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: gpu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # Give up GPU time on a commit that a newer push has already superseded.
    concurrency:
      group: cuda-${{ github.ref }}
      cancel-in-progress: true
    env:
      # The runner image has no nvcc, so tell cudarc which toolkit it builds against
      # (CUDA 13.2 -> 13020).
      CUDARC_CUDA_VERSION: "13020"
      # Build and run against the ONNX Runtime installed below rather than the one
      # `ort` downloads. Dynamic linking is required; a static link fails here.
      ORT_LIB_PATH: /opt/ortgpu/onnxruntime/capi
      ORT_PREFER_DYNAMIC_LINK: "1"

    steps:
      # The ort provider libraries link TensorRT 10, not the runner image's 11, and
      # `cuda-preprocess` selects the TensorRT provider by default. NVIDIA's apt repo
      # carries the 10.x libraries, which install alongside the image's own TensorRT.
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSLo /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          dpkg -i /tmp/cuda-keyring.deb
          apt-get update
          apt-get install -y pkg-config libssl-dev libnvinfer10 libnvonnxparsers10

      # The ONNX Runtime that `ort` downloads holds kernels for sm_75, sm_80 and sm_90
      # only, so nothing in it can run on the runner's Blackwell cards (sm_120). The
      # onnxruntime-gpu wheel carries sm_120 and is built against CUDA 13.
      - name: Install ONNX Runtime with Blackwell kernels
        run: |
          pip install --no-deps --target /opt/ortgpu onnxruntime-gpu==1.30.0
          cd "$ORT_LIB_PATH"
          # `ort` links -lonnxruntime while the loader asks for the SONAME, so both
          # names have to point at the versioned library.
          lib=$(basename "$(ls libonnxruntime.so.*.*.*)")
          ln -sf "$lib" libonnxruntime.so
          ln -sf "$lib" libonnxruntime.so.1

      # The runner image's CUDA, cuDNN and cuBLAS are pip wheels that nothing puts on
      # the loader path, so ONNX Runtime cannot find them without this.
      - name: Set library paths
        run: |
          nvidia_libs=$(ls -d /usr/local/lib/python3*/dist-packages/nvidia/*/lib | paste -sd:)
          echo "LD_LIBRARY_PATH=$ORT_LIB_PATH:$nvidia_libs:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # llvm-cov needs nightly. It lands second, so it becomes the default toolchain.
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          key: cuda

      - name: Ensure toolchain
        run: rustup show

      - name: Show GPU
        run: nvidia-smi

      # `cuda-preprocess` needs a CUDA toolkit to build, so no hosted runner lints it.
      # Both toolchains are installed above, so each command names the one it wants.
      - name: Clippy (annotate + cuda-preprocess)
        run: cargo +stable clippy --all-targets --no-default-features --features annotate,cuda-preprocess -- -D warnings

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --force

      # One run covers the src/cuda_inference.rs kernel tests, which need a real
      # device, and the GPU inference tests, which are #[ignore]d so that hosted
      # runners skip them. Only the thin CLI entry point is left out.
      - name: Coverage (annotate + cuda-preprocess, including ignored)
        run: |
          cargo +${{ env.NIGHTLY }} llvm-cov --no-default-features --features annotate,cuda-preprocess \
            --lcov --output-path lcov.info --ignore-filename-regex 'src/main\.rs' -- --include-ignored

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: ./lcov.info
          disable_search: true
          fail_ci_if_error: false
          plugins: noop
          flags: gpu_coverage
          use_oidc: true

  # Video feature tests for Linux - FFmpeg 7, 8 and 9
  test-video:
    name: test / linux / ffmpeg ${{ matrix.ffmpeg_version }}
    runs-on: ubuntu-latest
    container: jrottenberg/ffmpeg:${{ matrix.ffmpeg_version }}-ubuntu

    strategy:
      matrix:
        ffmpeg_version: ["9.0", "8.0", "7.1"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates clang curl pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          # Key on ffmpeg version so each container gets its own cache
          key: ffmpeg-${{ matrix.ffmpeg_version }}

      - name: Ensure toolchain
        run: rustup show

      - name: Clippy (annotate + video)
        run: cargo clippy --all --features annotate,video -- -D warnings

      - name: Tests (annotate + video)
        run: cargo test --all --features annotate,video

  # macOS FFmpeg 9 video build test
  build-macos-video:
    name: build / macos / ffmpeg 9 / video
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # macos-latest's default Xcode 16.4 toolchain dangles libclang_rt.osx.a
      # (ld: library 'clang_rt.osx' not found). Select a present, known-good
      # Xcode and export its version so the Rust cache key is scoped to it -
      # otherwise a cache built under one image's Xcode dangles on another.
      - name: Select Xcode (macOS)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vE 'beta|16\.4' | sort -V | tail -1)"
          xcodebuild -version
          echo "XCODE_VER=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: brew install ffmpeg

      - name: Capture FFmpeg version for cache key
        run: echo "FFMPEG_VERSION=$(brew list --versions ffmpeg | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-xcode-${{ env.XCODE_VER }}

      - name: Ensure toolchain
        run: rustup show

      - name: Build (annotate + video features)
        run: cargo build --release --features "annotate,video,visualize" --bin ultralytics-inference

  # Windows FFmpeg 8 and 9 video build test
  build-windows-video:
    name: build / windows / ffmpeg ${{ matrix.ffmpeg_version }} / video
    runs-on: windows-latest

    strategy:
      matrix:
        ffmpeg_version: ["9.0.1", "8.1.1"]
      fail-fast: false

    env:
      FFMPEG_VERSION: ${{ matrix.ffmpeg_version }}
      FFMPEG_DOWNLOAD_URL: https://github.com/GyanD/codexffmpeg/releases/download/${{ matrix.ffmpeg_version }}/ffmpeg-${{ matrix.ffmpeg_version }}-full_build-shared.7z

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg
          key: windows-ffmpeg-${{ env.FFMPEG_VERSION }}

      - name: Download FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest "${env:FFMPEG_DOWNLOAD_URL}" -OutFile ffmpeg-shared.7z
          7z x ffmpeg-shared.7z
          mkdir ffmpeg
          mv ffmpeg-*/* ffmpeg/

      - name: Set FFmpeg environment variables
        run: |
          $VCINSTALLDIR = $(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath)
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=${VCINSTALLDIR}\VC\Tools\LLVM\x64\bin"
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=${pwd}\ffmpeg"
          Add-Content $env:GITHUB_PATH "${pwd}\ffmpeg\bin"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      - name: Ensure toolchain
        run: rustup show

      - name: Build (annotate + video features)
        run: cargo build --features annotate,video

  # Browser/WebAssembly build: guards that the core library stays wasm-compatible
  # and that the WebGPU (ort-web) bindings + npm wrapper build end to end.
  wasm:
    name: wasm / browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          key: wasm

      - name: Ensure toolchain
        run: rustup show

      # The core crate must keep compiling for wasm without the native backend.
      - name: Build core lib for wasm32
        run: cargo build -p ultralytics-inference --lib --no-default-features --target wasm32-unknown-unknown

      - name: Clippy WebGPU bindings (wasm32)
        run: cargo clippy -p ultralytics-inference-web --target wasm32-unknown-unknown -- -D warnings

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --force

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Builds the wasm (wasm-pack) and the TypeScript wrapper.
      - name: Build npm package
        working-directory: web
        run: |
          npm ci
          npm run build

  # Code coverage (runs on Ubuntu with FFmpeg dev libs for full feature coverage)
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libavutil-dev libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev libpostproc-dev clang

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}

      # Nightly toolchain version in rustc -V already gives this job a unique cache key
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      - name: Ensure toolchain
        run: rustup show

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --force

      - name: Coverage
        # Exclude code that host-side unit tests cannot exercise: the minifb viewer
        # window (GUI), the thin CLI entry point, and the wasm32-only web crate. The
        # CUDA kernel is reported by the GPU job instead.
        run: cargo llvm-cov --features annotate,video,visualize --workspace --lcov --output-path lcov.info --ignore-filename-regex '(src/visualizer/viewer\.rs|src/main\.rs|crates/web/)'

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: ./lcov.info
          disable_search: true
          fail_ci_if_error: false
          plugins: noop
          flags: template_coverage
          use_oidc: true
