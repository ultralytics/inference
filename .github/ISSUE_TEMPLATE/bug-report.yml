name: 🐛 Bug Report
# title: " "
description: Problems with Ultralytics YOLO Rust inference
labels: [bug, triage]
type: "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting an Ultralytics 🐛 Bug Report!

  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please search the Ultralytics [Docs](https://docs.ultralytics.com) and [issues](https://github.com/ultralytics/inference/issues) to see if a similar bug report already exists.
      options:
        - label: >
            I have searched the Ultralytics [issues](https://github.com/ultralytics/inference/issues) and found no similar bug report.
          required: true

  - type: dropdown
    attributes:
      label: Ultralytics Component
      description: |
        Please select the component where you found the bug.
      multiple: true
      options:
        - "Install or build"
        - "CLI"
        - "Rust API"
        - "Model loading"
        - "Predict"
        - "Video"
        - "Visualize or annotate"
        - "Hardware acceleration"
        - "WebGPU (npm)"
        - "Documentation"
        - "Other"
    validations:
      required: false

  - type: textarea
    attributes:
      label: Bug
      description: Please provide as much information as possible. Copy and paste console output and error messages including the _full_ traceback. Use [Markdown](https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax) to format text, code and logs. If necessary, include screenshots for visual elements only. Providing detailed information will help us resolve the issue more efficiently.
      placeholder: |
        💡 ProTip! Include as much information as possible (logs, tracebacks, screenshots, etc.) to receive the most helpful response.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Please provide your system information to help us diagnose the problem.
      placeholder: |
        Please include:
        - OS (e.g., Ubuntu 22.04, macOS 15.5, Windows 11)
        - Rust toolchain (e.g., rustc --version)
        - Crate version and features (e.g., ultralytics-inference 0.0.35 with cuda,video)
        - Model (e.g., yolo26n.onnx exported with ultralytics 8.3.x)
        - Hardware (e.g., CPU, GPU model)
        - For @ultralytics/yolo: npm package version and browser (e.g., Chrome 138, WebGPU)

        Example:
        ```
        OS: macOS-15.5
        Rust: rustc 1.89.0
        Crate: ultralytics-inference 0.0.35 (features: coreml,annotate)
        Model: yolo26n.onnx
        Hardware: Apple M3, 16GB RAM
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Minimal Reproducible Example
      description: >
        When asking a question, people will be better able to provide help if you provide code that they can easily understand and use to **reproduce** the problem. This is referred to by community members as creating a [minimal reproducible example](https://docs.ultralytics.com/help/minimum-reproducible-example).
      placeholder: |
        ```bash
        ultralytics-inference predict --model yolo26n.onnx --source bus.jpg  # command to reproduce your issue here
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional
      description: Anything else you would like to share?

  - type: checkboxes
    attributes:
      label: Are you willing to submit a PR?
      description: >
        (Optional) We encourage you to submit a [Pull Request](https://github.com/ultralytics/inference/pulls) (PR) to help improve Ultralytics software for everyone, especially if you have a good understanding of how to implement a fix or feature.
        See the Ultralytics [Contributing Guide](https://docs.ultralytics.com/help/contributing) to get started.
      options:
        - label: Yes I'd like to help by submitting a PR!
